[package]
name = "gitflow"
version = "0.6.2"
edition = "2021"
authors = ["Jason Wang <wleovm@gmail.com>"]
keywords = ["git", "gitflow"]
license = "MIT"
homepage = "https://github.com/wang-borong/git-flow.rs"
repository = "https://github.com/wang-borong/git-flow.rs"
categories = ["command-line-utilities"]
description = "Extensible git flow written in rust for product developpment"

[[bin]]
name = "gitflow"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
regex = "1.12"
anyhow = "1.0"
tokio = { version = "1.52", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
toml = "1.1"
tabled = "0.21"
terminal_size = "0.4"
git2 = "0.21"

[dev-dependencies]
tempfile = "3"
